version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns:
          - "*"

  # No pip entry. The skills use the Python standard library only, so there
  # is no requirements file for Dependabot to watch.

  # Paseo plugins under plugins/ are Node projects with their own lockfile.
  - package-ecosystem: npm
    directory: /plugins/file-viewer
    schedule:
      interval: monthly
    # One pull request for the month's minor and patch updates, so the lockfile
    # is changed once and the checks run once.
    groups:
      dev-dependencies:
        update-types: ["minor", "patch"]
    labels:
      - dependencies
    commit-message:
      prefix: "chore"
    ignore:
      # Paseo supplies react and react-native to a plugin at runtime, and the
      # scaffold pins them. These dev dependencies are only types for that host,
      # so they move when Paseo's own scaffold does, by hand.
      - dependency-name: "react"
      - dependency-name: "react-native"
      - dependency-name: "@types/react"
      # Types for the Node the plugin subprocess runs under, kept at the floor.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Paseo's scaffold uses TypeScript 5.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # The host library follows Paseo releases, on purpose and by hand.
      - dependency-name: "@getpaseo/plugin"

  - package-ecosystem: npm
    directory: /plugins/secrets
    schedule:
      interval: monthly
    # One pull request for the month's minor and patch updates, so the lockfile
    # is changed once and the checks run once.
    groups:
      dev-dependencies:
        update-types: ["minor", "patch"]
    labels:
      - dependencies
    commit-message:
      prefix: "chore"
    ignore:
      # Paseo supplies react and react-native to a plugin at runtime, and the
      # scaffold pins them. These dev dependencies are only types for that host,
      # so they move when Paseo's own scaffold does, by hand.
      - dependency-name: "react"
      - dependency-name: "react-native"
      - dependency-name: "@types/react"
      # Types for the Node the plugin subprocess runs under, kept at the floor.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Paseo's scaffold uses TypeScript 5.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # The host library follows Paseo releases, on purpose and by hand.
      - dependency-name: "@getpaseo/plugin"
