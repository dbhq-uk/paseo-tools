name: File viewer

on:
  push:
    paths:
      - "plugins/file-viewer/**"
      - ".github/workflows/file-viewer.yml"
  pull_request:
    paths:
      - "plugins/file-viewer/**"
      - ".github/workflows/file-viewer.yml"
  workflow_dispatch:

# A second push to the same branch cancels the first.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: plugins/file-viewer

jobs:
  test:
    name: Test on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22", "24"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The renderer shells out to these. Fixtures are committed, so pandoc and
      # qpdf are not needed here - only what the plugin itself calls at runtime.
      - name: Install render tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            poppler-utils imagemagick librsvg2-bin

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: plugins/file-viewer/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: plugins/file-viewer/package-lock.json
      - run: npm ci
      # SheetJS is deliberately absent because of prototype pollution and ReDoS
      # in its parser. This gate is what stops it, or anything like it, arriving
      # through a transitive dependency later.
      #
      # Production dependencies only, at high. The dev toolchain (react-native,
      # jest) is never shipped, and its advisories are not this plugin's to fix.
      # One moderate is accepted on purpose: sprintf-js (via mammoth, via
      # argparse) has no patched release, and argparse only formats CLI help
      # text, which mammoth does not run. Revisit when mammoth moves off it.
      - name: Fail on high or worse in what ships
        run: npm audit --omit=dev --audit-level=high

  fixtures:
    name: Fixture generator still runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install authoring tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pandoc qpdf imagemagick poppler-utils librsvg2-bin libavif-bin

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: plugins/file-viewer/package-lock.json

      - run: npm ci

      # Fixtures are committed, so this does not gate the test job. It catches
      # the generator rotting unnoticed.
      - name: Regenerate and check the expected set appears
        run: |
          node test/make-fixtures.mjs
          missing=0
          for f in contract.docx scanned-report.docx invoices.xlsx statement.pdf \
                   locked.pdf photo.png diagram.svg banner.avif \
                   legacy-format.docx not-really.xlsx truncated.pdf; do
            if [ ! -s "test/fixtures/$f" ]; then
              echo "::error::generator did not produce $f"
              missing=1
            fi
          done
          exit $missing

      - name: Tests still pass against freshly generated fixtures
        run: npm test
