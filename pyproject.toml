# Tooling config only. This is not a package: each skill is a directory that runs
# on the standard library, and nothing here is ever built or published.

[tool.ruff]
# 3.9 is the skills' floor. Setting it here stops ruff rewriting annotations into
# syntax that breaks the oldest Python this supports.
target-version = "py39"
line-length = 120
exclude = [".venv", "venv", "scratch"]

[tool.ruff.lint]
# Deliberately modest. The job is to stop new rot, not to relitigate working code.
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "W",    # pycodestyle warnings
]

ignore = [
    "E501",  # line-too-long: line-length is advisory for the formatter, not a hard gate.
    "B008",  # function call in default argument - not a pattern here.
]

[tool.ruff.lint.per-file-ignores]
# Test modules load their subject by path, so the sys.path.insert must run
# before the import. E402 is the correct shape here, not a mistake.
"**/tests/*.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["ferry"]

[tool.ruff.format]
quote-style = "preserve"
